[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline"
version = "0.1.0"
description = "AutoML Production Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "mlflow>=2.13",
    "optuna>=3.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.0",
    "shap>=0.45",
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ['py311']
